[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pension-pro-mcp"
version = "0.2.1"
description = "MCP server for the PensionPro API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Douglas Linsmeyer", email = "douglaslinsmeyer@gmail.com" },
]
keywords = ["mcp", "pensionpro", "pension", "ai", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/douglaslinsmeyer/pension-pro-mcp"
Repository = "https://github.com/douglaslinsmeyer/pension-pro-mcp"
Issues = "https://github.com/douglaslinsmeyer/pension-pro-mcp/issues"
Changelog = "https://github.com/douglaslinsmeyer/pension-pro-mcp/releases"

[project.scripts]
pension-pro-mcp = "pension_pro_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pension_pro_mcp"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
